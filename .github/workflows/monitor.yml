name: Monitor Ações

on:
  schedule:
    # 10:07, 11:07, 12:07, 13:07, 14:07, 15:07 e 16:07 no horário de Brasília/João Pessoa
    # GitHub Actions usa UTC no cron, então 10h-16h BRT = 13h-19h UTC
    - cron: '*/15 13-19 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: monitor-acoes
  cancel-in-progress: false

jobs:
  executar-monitor:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código do repositório
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Criar pasta de dados, se necessário
        run: mkdir -p dados_monitor

      - name: Rodar monitor
        run: python monitor_b3.py

      - name: Mostrar arquivos gerados
        run: |
          echo "Conteúdo da pasta dados_monitor:"
          ls -lah dados_monitor || true

      - name: Commitar arquivos atualizados
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add dados_monitor/

          if git diff --cached --quiet; then
            echo "Nenhuma alteração para commit."
          else
            git commit -m "Atualização automática do monitor de ações"
            git push
          fi
